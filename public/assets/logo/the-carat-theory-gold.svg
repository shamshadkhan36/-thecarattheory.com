<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%">
  <!-- Emblem -->
  <g transform="translate(6, 6)">
    <circle cx="29" cy="29" r="28" stroke="#E8D5B5" stroke-width="1.6" fill="none" />
    
    <!-- Diamond -->
    <g transform="translate(0, -4)">
      <polygon points="23,17 35,17 40,23 18,23" stroke="#E8D5B5" stroke-width="1.3" fill="rgba(212,175,55,0.12)" />
      <polygon points="23,17 29,23 35,17" stroke="#E8D5B5" stroke-width="1.1" fill="none" />
      <polygon points="18,23 23,17 25,23" stroke="#E8D5B5" stroke-width="1.1" fill="none" />
      <polygon points="40,23 35,17 33,23" stroke="#E8D5B5" stroke-width="1.1" fill="none" />
      <polygon points="18,23 40,23 29,35" stroke="#E8D5B5" stroke-width="1.4" fill="rgba(212,175,55,0.06)" />
      <line x1="25" y1="23" x2="29" y2="35" stroke="#E8D5B5" stroke-width="1.1" />
      <line x1="33" y1="23" x2="29" y2="35" stroke="#E8D5B5" stroke-width="1.1" />
      <!-- Sparkle Star at Top -->
      <path d="M 29 9 L 30 12 L 33 13 L 30 14 L 29 17 L 28 14 L 25 13 L 28 12 Z" fill="#E8D5B5" />
    </g>
    
    <!-- Cupped hands / pedestal -->
    <path d="M 12 43 C 14 36, 18 31, 23 29 C 25.5 28.5, 27 30, 25.5 32 C 21 35, 18 39, 17 44 Z" fill="#E8D5B5" />
    <path d="M 46 43 C 44 36, 40 31, 35 29 C 32.5 28.5, 31 30, 32.5 32 C 37 35, 40 39, 41 44 Z" fill="#E8D5B5" />
    <path d="M 22 46 Q 29 50 36 46" stroke="#E8D5B5" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography -->
  <g transform="translate(74, 0)">
    <!-- Primary Title: THE CARAT THEORY -->
    <text x="0" y="37" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', 'Baskerville', 'Times New Roman', serif" 
          font-size="20" 
          font-weight="500" 
          letter-spacing="0.16em" 
          fill="#E8D5B5">THE CARAT THEORY</text>
    <!-- Subtitle: DIAMONDS -->
    <text x="3" y="53" 
          font-family="'Roboto Condensed', 'Jost', sans-serif" 
          font-size="9" 
          font-weight="400" 
          letter-spacing="0.42em" 
          fill="#D4AF37">DIAMONDS</text>
  </g>
</svg>