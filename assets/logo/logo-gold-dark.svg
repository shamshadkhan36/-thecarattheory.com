<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C986" />
      <stop offset="25%" stop-color="#FFF2CE" />
      <stop offset="50%" stop-color="#DFC07B" />
      <stop offset="75%" stop-color="#FFE8B0" />
      <stop offset="100%" stop-color="#B8934A" />
    </linearGradient>
    <filter id="luxuryGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- LOGO ICON / EMBLEM -->
  <g transform="translate(18, 12)">
    <path d="M 48 4 L 78 22 L 78 66 L 48 92 L 18 66 L 18 22 Z" 
          fill="none" stroke="url(#goldGradDark)" stroke-width="2.2" stroke-linejoin="round" />
    
    <polygon points="32,22 64,22 72,38 24,38" 
             fill="none" stroke="url(#goldGradDark)" stroke-width="1.6" stroke-linejoin="round" opacity="0.9" />
             
    <polygon points="48,8 60,22 48,32 36,22" 
             fill="url(#goldGradDark)" opacity="0.25" />
    <polygon points="48,8 60,22 48,32 36,22" 
             fill="none" stroke="url(#goldGradDark)" stroke-width="1.4" />
             
    <line x1="48" y1="32" x2="48" y2="82" stroke="url(#goldGradDark)" stroke-width="1.8" />
    <line x1="28" y1="48" x2="68" y2="48" stroke="url(#goldGradDark)" stroke-width="1.6" />
    
    <line x1="18" y1="66" x2="48" y2="88" stroke="url(#goldGradDark)" stroke-width="1.5" />
    <line x1="78" y1="66" x2="48" y2="88" stroke="url(#goldGradDark)" stroke-width="1.5" />
    <line x1="24" y1="38" x2="48" y2="48" stroke="url(#goldGradDark)" stroke-width="1.3" opacity="0.8" />
    <line x1="72" y1="38" x2="48" y2="48" stroke="url(#goldGradDark)" stroke-width="1.3" opacity="0.8" />
    <line x1="28" y1="48" x2="48" y2="88" stroke="url(#goldGradDark)" stroke-width="1.4" opacity="0.85" />
    <line x1="68" y1="48" x2="48" y2="88" stroke="url(#goldGradDark)" stroke-width="1.4" opacity="0.85" />
    
    <circle cx="48" cy="48" r="3" fill="#FFF8E7" filter="url(#luxuryGlowDark)" />
    
    <path d="M 82 14 Q 85 20 91 22 Q 85 24 82 30 Q 80 24 74 22 Q 80 20 82 14 Z" 
          fill="url(#goldGradDark)" opacity="0.9" />
  </g>

  <!-- BRAND NAME TYPOGRAPHY -->
  <g transform="translate(130, 0)">
    <text x="0" y="58" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', 'Baskerville', 'Georgia', serif" 
          font-size="34" 
          font-weight="500" 
          letter-spacing="0.22em" 
          fill="#F5F2EB">
      THE CARAT THEORY
    </text>

    <text x="3" y="85" 
          font-family="'Jost', 'Montserrat', 'Helvetica Neue', sans-serif" 
          font-size="10.5" 
          font-weight="400" 
          letter-spacing="0.42em" 
          fill="#DFC07B">
      FINE JEWELLERY &amp; CERTIFIED DIAMONDS
    </text>

    <line x1="3" y1="94" x2="420" y2="94" stroke="url(#goldGradDark)" stroke-width="0.8" opacity="0.4" />
  </g>
</svg>
