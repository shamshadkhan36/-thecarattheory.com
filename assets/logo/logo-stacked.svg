<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="stackedGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C784" />
      <stop offset="25%" stop-color="#FDF3D6" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#B8934A" />
      <stop offset="100%" stop-color="#8C6A28" />
    </linearGradient>
    <filter id="stackedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Centered Diamond Facet Icon -->
  <g transform="translate(200, 20) scale(1)">
    <!-- Outer Contour -->
    <polygon points="25,10 75,10 95,38 50,92 5,38" 
             fill="none" stroke="url(#stackedGold)" stroke-width="2.6" stroke-linejoin="round" />

    <!-- Table Facet (Top Flat) -->
    <polygon points="35,10 65,10 78,38 22,38" 
             fill="none" stroke="url(#stackedGold)" stroke-width="2" stroke-linejoin="round" />

    <!-- Star & Kite Facets (Upper Crown) -->
    <polygon points="50,10 60,25 40,25" 
             fill="url(#stackedGold)" fill-opacity="0.18" stroke="url(#stackedGold)" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="50,10 40,25 35,10" 
             fill="none" stroke="url(#stackedGold)" stroke-width="1.6" stroke-linejoin="round" />
    <polygon points="50,10 65,10 60,25" 
             fill="none" stroke="url(#stackedGold)" stroke-width="1.6" stroke-linejoin="round" />

    <polygon points="25,10 35,10 22,38" 
             fill="none" stroke="url(#stackedGold)" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="75,10 65,10 78,38 95,38" 
             fill="none" stroke="url(#stackedGold)" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="5,38 25,10 22,38" 
             fill="none" stroke="url(#stackedGold)" stroke-width="1.8" stroke-linejoin="round" />

    <line x1="40" y1="25" x2="22" y2="38" stroke="url(#stackedGold)" stroke-width="1.8" />
    <line x1="60" y1="25" x2="78" y2="38" stroke="url(#stackedGold)" stroke-width="1.8" />
    <line x1="50" y1="25" x2="50" y2="38" stroke="url(#stackedGold)" stroke-width="1.8" />

    <line x1="22" y1="38" x2="50" y2="92" stroke="url(#stackedGold)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="78" y1="38" x2="50" y2="92" stroke="url(#stackedGold)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="50" y1="38" x2="50" y2="92" stroke="url(#stackedGold)" stroke-width="2.2" stroke-linecap="round" />

    <line x1="5" y1="38" x2="36" y2="65" stroke="url(#stackedGold)" stroke-width="1.4" opacity="0.8" />
    <line x1="95" y1="38" x2="64" y2="65" stroke="url(#stackedGold)" stroke-width="1.4" opacity="0.8" />
    <line x1="36" y1="65" x2="50" y2="92" stroke="url(#stackedGold)" stroke-width="1.4" opacity="0.8" />
    <line x1="64" y1="65" x2="50" y2="92" stroke="url(#stackedGold)" stroke-width="1.4" opacity="0.8" />

    <circle cx="50" cy="38" r="3.2" fill="#FFFBEB" filter="url(#stackedGlow)" />
  </g>

  <!-- "THE" -->
  <text x="250" y="160" 
        text-anchor="middle"
        font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', serif" 
        font-size="20" 
        font-weight="500" 
        letter-spacing="0.45em" 
        fill="#8A6E3B">
    THE
  </text>

  <!-- "CARAT THEORY" -->
  <text x="250" y="210" 
        text-anchor="middle"
        font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', serif" 
        font-size="44" 
        font-weight="500" 
        letter-spacing="0.22em" 
        fill="#111215">
    CARAT THEORY
  </text>

  <!-- Decorative Architectural Lines -->
  <line x1="120" y1="235" x2="200" y2="235" stroke="url(#stackedGold)" stroke-width="1" opacity="0.6" />
  <polygon points="250,232 254,235 250,238 246,235" fill="url(#stackedGold)" />
  <line x1="300" y1="235" x2="380" y2="235" stroke="url(#stackedGold)" stroke-width="1" opacity="0.6" />

  <!-- Sub-label -->
  <text x="250" y="265" 
        text-anchor="middle"
        font-family="'Jost', 'Montserrat', sans-serif" 
        font-size="11" 
        font-weight="400" 
        letter-spacing="0.42em" 
        fill="#7A6538">
    FINE JEWELLERY · CERTIFIED DIAMONDS
  </text>

  <text x="250" y="290" 
        text-anchor="middle"
        font-family="'Jost', 'Montserrat', sans-serif" 
        font-size="9" 
        font-weight="300" 
        letter-spacing="0.32em" 
        fill="#9E9E9E">
    ANTWERP · NEW YORK · MUMBAI
  </text>
</svg>
