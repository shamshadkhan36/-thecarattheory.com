<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="monoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C784" />
      <stop offset="30%" stop-color="#FDF3D6" />
      <stop offset="55%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#B8934A" />
      <stop offset="100%" stop-color="#8C6A28" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Diamond Brilliant Cut Emblem matching the high jewelry box -->
  <g transform="translate(10, 15) scale(0.8)">
    <!-- Outer Contour -->
    <polygon points="25,10 75,10 95,38 50,92 5,38" 
             fill="none" stroke="url(#monoGold)" stroke-width="2.6" stroke-linejoin="round" />

    <!-- Table Facet (Top Flat) -->
    <polygon points="35,10 65,10 78,38 22,38" 
             fill="none" stroke="url(#monoGold)" stroke-width="2" stroke-linejoin="round" />

    <!-- Star & Kite Facets (Upper Crown) -->
    <!-- Center star triangle -->
    <polygon points="50,10 60,25 40,25" 
             fill="url(#monoGold)" fill-opacity="0.18" stroke="url(#monoGold)" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="50,10 40,25 35,10" 
             fill="none" stroke="url(#monoGold)" stroke-width="1.6" stroke-linejoin="round" />
    <polygon points="50,10 65,10 60,25" 
             fill="none" stroke="url(#monoGold)" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Kite side upper facets -->
    <polygon points="25,10 35,10 22,38" 
             fill="none" stroke="url(#monoGold)" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="75,10 65,10 78,38 95,38" 
             fill="none" stroke="url(#monoGold)" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="5,38 25,10 22,38" 
             fill="none" stroke="url(#monoGold)" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Crown to Table Connections -->
    <line x1="40" y1="25" x2="22" y2="38" stroke="url(#monoGold)" stroke-width="1.8" />
    <line x1="60" y1="25" x2="78" y2="38" stroke="url(#monoGold)" stroke-width="1.8" />
    <line x1="50" y1="25" x2="50" y2="38" stroke="url(#monoGold)" stroke-width="1.8" />

    <!-- Lower Pavilion Facets converging to Culet (50, 92) -->
    <line x1="22" y1="38" x2="50" y2="92" stroke="url(#monoGold)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="78" y1="38" x2="50" y2="92" stroke="url(#monoGold)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="50" y1="38" x2="50" y2="92" stroke="url(#monoGold)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Lower Halves Sub-facets -->
    <line x1="5" y1="38" x2="36" y2="65" stroke="url(#monoGold)" stroke-width="1.4" opacity="0.8" />
    <line x1="95" y1="38" x2="64" y2="65" stroke="url(#monoGold)" stroke-width="1.4" opacity="0.8" />
    <line x1="36" y1="65" x2="50" y2="92" stroke="url(#monoGold)" stroke-width="1.4" opacity="0.8" />
    <line x1="64" y1="65" x2="50" y2="92" stroke="url(#monoGold)" stroke-width="1.4" opacity="0.8" />

    <!-- Center Light Point / Brilliant Sparkle -->
    <circle cx="50" cy="38" r="3" fill="#FFFBEB" filter="url(#goldGlow)" />
  </g>
</svg>
